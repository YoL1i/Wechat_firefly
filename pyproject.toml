[project]
name = "wchat-agent"
version = "0.1.0"
description = "An AI agent that lives in your WeChat"
requires-python = ">=3.12"
dependencies = [
    "wcf>=0.3.5",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "edge-tts>=6.0.0",
    "apscheduler>=3.10.0",
    "websockets>=12.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
